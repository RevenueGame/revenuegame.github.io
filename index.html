<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe6; --paper2:#ebe5d8; --card:#fbf9f4; --ink:#131210; --ink2:#3d3a34; --mute:#7a746a; --line:#d9d1c1;
  --red:#e3342b; --green:#17955a; --yellow:#f2c94c;
  --display:'Anton',Impact,sans-serif; --serif:'Instrument Serif',Georgia,serif; --body:'Inter Tight',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:4px 4px;z-index:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.shell{position:relative;z-index:1}

@keyframes tick{to{transform:translateX(-100%)}}

/* NAV */
nav{max-width:1120px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .logo{width:42px;height:42px;display:block}
.brand .mark{width:38px;height:38px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:18px;letter-spacing:.02em;position:relative}
.brand .mark::after{content:"↗";position:absolute;right:-6px;top:-8px;font-family:var(--body);font-weight:800;font-size:15px;color:var(--red)}
.brand .nm{font-family:var(--display);font-size:24px;letter-spacing:.03em;text-transform:uppercase}
.links{display:flex;gap:4px;flex-wrap:wrap}
.links a{text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
.links a.on{background:var(--ink);color:var(--paper)}
.links a:not(.on):hover{background:var(--paper2)}
main{max-width:1120px;margin:0 auto;padding:28px 20px 70px}

/* HERO */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:start}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
.h1{font-family:var(--display);font-size:clamp(62px,9vw,118px);line-height:.86;text-transform:uppercase;margin:12px 0 0;letter-spacing:.005em}
.h1 .bs{color:var(--red);display:inline-block;transform:rotate(-3deg)}
.h1 i{font-family:var(--serif);font-style:italic;text-transform:none;font-size:.62em;color:var(--ink2);letter-spacing:0}
.kick{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3vw,34px);color:var(--ink2);margin-top:14px;line-height:1.1}
.lead{font-size:18px;line-height:1.55;color:var(--ink2);margin:18px 0 22px;max-width:470px}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;border:1.5px solid var(--ink);padding:6px 10px;border-radius:999px;font-weight:700}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.sub{margin-top:26px;padding:18px;border:2px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink)}
.sub h3{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.sub p{color:var(--ink2);font-size:14.5px;line-height:1.5;margin:6px 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:13px 18px;text-decoration:none;border:2px solid var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--red)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}

/* GAME */
.game{background:var(--card);border:2px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:20px;position:relative;min-height:520px}
.ghead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:12px}
.prog{display:flex;gap:4px;margin-bottom:16px}
.prog i{flex:1;height:6px;background:var(--paper2)}
.prog i.g{background:var(--green)}.prog i.r{background:var(--red)}.prog i.c{background:var(--ink)}
.prog i.boss{outline:1.5px dashed var(--red);outline-offset:1px}
.qcard{position:relative;border:2px solid var(--ink);background:#fff;padding:26px 22px 30px;min-height:210px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.qcard .num{font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.qcard .num .tag{background:var(--ink);color:var(--paper);padding:2px 7px;font-weight:700}
.qcard .num .tag.boss{background:var(--red)}
.qcard .q{font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.3}
.bar{position:absolute;left:0;bottom:0;height:5px;background:var(--ink);transition:width .1s linear}
.stamp{position:absolute;right:16px;bottom:14px;font-family:var(--display);font-size:clamp(40px,6vw,60px);text-transform:uppercase;letter-spacing:.04em;padding:2px 14px;border:5px solid currentColor;border-radius:6px;transform:rotate(-12deg);opacity:.92;animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both;mix-blend-mode:multiply;pointer-events:none}
.stamp.v{color:var(--green)}.stamp.b{color:var(--red)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.6);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.choices button{font-family:var(--display);font-size:clamp(26px,3.4vw,34px);text-transform:uppercase;letter-spacing:.04em;padding:16px 8px;border:2px solid var(--ink);transition:transform .1s,box-shadow .1s}
.choices .cv{background:#e3f4ea;color:var(--green)}
.choices .cb{background:#fde6e3;color:var(--red)}
.choices button:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.choices button:disabled{opacity:.3;cursor:default}
.kbd{text-align:center;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:8px}
.reveal{margin-top:14px;border-left:5px solid var(--ink);background:var(--paper);padding:14px 16px;animation:up .3s both}
.reveal .v{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.reveal .v.ok{color:var(--green)}.reveal .v.ko{color:var(--red)}
.reveal p{color:var(--ink2);font-size:15px;line-height:1.5;margin:4px 0 8px}
.reveal .src{font-family:var(--mono);font-size:11px;color:var(--mute)}
.reveal .rg{display:inline-block;margin-top:8px;font-weight:700;font-size:13.5px;color:var(--red);text-decoration:none;border-bottom:2px solid var(--red)}
.reveal .btn{margin-top:12px;width:100%;justify-content:center}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-height:470px;gap:14px}
.intro .big{font-family:var(--display);font-size:clamp(44px,5vw,64px);text-transform:uppercase;line-height:.9}
.intro .big span{color:var(--red)}
.intro ul{list-style:none;display:grid;gap:8px;margin:4px 0 8px}
.intro li{font-size:15px;color:var(--ink2);padding-left:22px;position:relative}
.intro li::before{content:"■";position:absolute;left:0;color:var(--red);font-size:12px;top:2px}

/* END */
.end{text-align:center;padding:10px 0}
.end .score{font-family:var(--display);font-size:120px;line-height:.9}
.end .score small{font-size:44px;color:var(--mute)}
.end .title{display:inline-block;font-family:var(--display);font-size:32px;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 14px;transform:rotate(-2deg);margin:8px 0}
.end .d{color:var(--ink2);max-width:420px;margin:10px auto 0;line-height:1.5}
.grid{font-size:26px;letter-spacing:3px;margin:14px 0 6px}
@media(max-width:520px){.grid{font-size:19px;letter-spacing:1px}}
.share{margin-top:16px;text-align:left}
.share textarea{width:100%;min-height:150px;border:2px solid var(--ink);background:#fff;padding:12px;font:500 14px/1.5 var(--body);resize:vertical;color:var(--ink)}
.share .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.okmsg{font-size:13px;color:var(--green);font-weight:700}

/* PREVIEW */
.preview-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--yellow);border:2px solid var(--ink);padding:10px 14px;margin-bottom:22px;font-size:14px}
.preview-bar b{font-family:var(--mono);letter-spacing:.06em}
.pvlist{gap:8px;margin:-8px 0 26px;background:var(--card);border:2px dashed var(--ink);padding:14px}
.pvlist div{font-size:14.5px;line-height:1.45}
.pvlist small{display:block;color:var(--mute);font-size:12.5px;margin:2px 0 0 52px}
.pv-v,.pv-b{display:inline-block;width:44px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;padding:2px 0;margin-right:8px}
.pv-v{background:var(--green)}.pv-b{background:var(--red)}

/* SECTIONS */
.sec{margin-top:70px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:20px;flex-wrap:wrap}
.sech h2{font-family:var(--display);font-size:clamp(36px,5vw,54px);text-transform:uppercase;line-height:.95}
.sech h2 i{font-family:var(--serif);text-transform:none;color:var(--red);font-size:.8em}
.sech a{font-weight:700;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ed{background:var(--card);border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:transform .12s,box-shadow .12s;min-height:170px}
a.ed:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.ed .n{font-family:var(--display);font-size:42px;line-height:1;color:var(--red)}
.ed .t{font-weight:800;font-size:17px;line-height:1.3}
.ed .hk{font-size:13.5px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ed .th{margin-top:auto;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.06em}
.ed .new{align-self:flex-start;background:var(--yellow);font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filters button{font-weight:600;font-size:13.5px;border:1.5px solid var(--ink);padding:7px 12px;border-radius:999px}
.filters button.on{background:var(--ink);color:var(--paper)}
.note{margin-top:18px;font-size:13.5px;color:var(--mute);border:1.5px dashed var(--line);padding:12px 14px}
.weeks{display:grid;gap:12px}
.wk{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--card);border:2px solid var(--ink);padding:16px 18px}
.wk .n{font-family:var(--display);font-size:40px;line-height:1}
.wk .t{font-weight:800;font-size:18px}
.wk .s{font-size:13.5px;color:var(--mute);margin-top:3px}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:start}
.about .badge{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:26px;box-shadow:10px 10px 0 var(--red)}
.about .badge .big{font-family:var(--display);font-size:54px;line-height:.9;text-transform:uppercase}
.about .badge p{font-family:var(--serif);font-style:italic;font-size:22px;margin-top:12px;color:#d9d3c6}
.about .txt p{font-size:17px;line-height:1.6;color:var(--ink2);margin-bottom:14px}
.about .txt b{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
footer{border-top:2px solid var(--ink);max-width:1120px;margin:0 auto;padding:22px 20px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
footer b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.03em}

@media (max-width:880px){
  .hero,.about{grid-template-columns:1fr}
  .game{box-shadow:6px 6px 0 var(--ink);min-height:auto}
  .wk{grid-template-columns:auto 1fr}
  .wk .btn{grid-column:1/-1;justify-content:center}
  nav{justify-content:center}
  .hero{gap:0}
  .left{display:contents}
  .game{order:1;margin:24px 0 8px}
  .sub{order:2}
  .h1{font-size:54px}
  .kick{display:none}
  .lead{font-size:16px;margin-top:10px}
  .meta{margin-top:12px}
  .intro{min-height:auto;gap:10px}
  .intro .big{display:none}
  .intro ul{font-size:14px}
  .intro li:last-child,.kbd{display:none}
}
</style>
</head>

function route(){
  clearInterval(timer);
  const h = (location.hash||"#jeu").slice(1);
  const wk = WEEKS.find(w=>w.id===h);
  document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on", !!(a.dataset.r===h || (h==="" && a.dataset.r==="jeu") || (wk && a.dataset.r==="archives"))));
  if(h==="apercu") return pagePreview();
  if(wk) return pageGame(wk, true);
  if(h==="archives") return pageArchives();
  if(h==="newsletter") return pageNewsletter();
  if(h==="a-propos") return pageAbout();
  pageGame(WEEKS[0], false);
}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});

    </ul>
    <button class="btn red" id="start">Lancer la partie →</button>
  </div>`;
  document.getElementById("start").onclick=()=>{G.i=0;question()};
}

function question(){
  const it=G.wk.items[G.i]; G.answered=false;
  const g=document.getElementById("game");
  g.innerHTML=`
    <div class="ghead"><span>${esc(G.wk.label).toUpperCase()}</span><span>${G.i+1} / ${G.wk.items.length}</span></div>
    <div class="prog">${G.wk.items.map((x,k)=>`<i class="${k<G.res.length?(G.res[k]?'g':'r'):k===G.i?'c':''} ${x.boss?'boss':''}"></i>`).join("")}</div>
    <div class="qcard" id="qc">
      <div class="num"><span class="tag ${it.boss?'boss':''}">${it.boss?'QUESTION BOSS':'#'+String(G.i+1).padStart(2,'0')}</span></div>
      <div class="q">${esc(it.q)}</div>
      <div class="bar" id="bar" style="width:100%"></div>
    </div>
    <div class="choices" id="ch"><button class="cv" data-a="1">Vrai</button><button class="cb" data-a="0">Bullshit</button></div>
    <div class="kbd">V = vrai · B = bullshit</div>
    <div id="rv"></div>`;
  g.querySelectorAll("#ch button").forEach(b=>b.onclick=()=>answer(b.dataset.a==="1"));
  const t0=Date.now(); clearInterval(timer);
  timer=setInterval(()=>{const el=(Date.now()-t0)/1000,bar=document.getElementById("bar");
    if(!bar){clearInterval(timer);return}
    bar.style.width=Math.max(0,100-el/TIME*100)+"%"; bar.style.background=el>TIME*.7?"var(--red)":"var(--ink)";
    if(el>=TIME) answer(null)},100);
}

function answer(ans){
  if(G.answered) return; G.answered=true; clearInterval(timer);
  const it=G.wk.items[G.i], ok=ans===it.a; G.res.push(ok);
  document.querySelectorAll("#ch button").forEach(b=>b.disabled=true);
  document.getElementById("qc").insertAdjacentHTML("beforeend",`<div class="stamp ${it.a?'v':'b'}">${it.a?'Vrai':'Bullshit'}</div>`);
  const ed = it.ed && edBy(it.ed);
  const last = G.i===G.wk.items.length-1;
  document.getElementById("rv").innerHTML=`<div class="reveal">
    <div class="v ${ok?'ok':'ko'}">${ans===null?'Temps écoulé':ok?'Bien vu':'Raté'}</div>
    <p>${esc(it.x)}</p>
    <div class="src">Source : ${esc(it.s)}</div>
    ${ed?`<a class="rg" href="${ed.url||'#newsletter'}" ${ed.url?'target="_blank" rel="noopener"':''}>Toute l’histoire dans Revenue Game #${ed.n} →</a>`:""}
    <button class="btn" id="nx">${last?'Voir mon score →':'Suivante →'}</button></div>`;
  document.getElementById("nx").onclick=()=>{G.i++; G.i<G.wk.items.length?question():end()};
}

document.addEventListener("keydown",e=>{
  if(!G||G.i<0||!document.getElementById("ch")) return;
  if(G.answered){ if(e.key==="Enter"){const n=document.getElementById("nx"); if(n) n.click()} return }
  const k=e.key.toLowerCase(); if(k==="v") answer(true); if(k==="b") answer(false);
});

function end(){
  const n=G.wk.items.length, sc=G.res.filter(Boolean).length, boss=G.res[n-1];
  const p=sc/n; const [t,d] = sc===n?["Directeur partenariats","Sans-faute. Tu pourrais négocier ces deals toi-même."]
    : p>=.8?["Insider","Tu lis la presse sport business, et ça se voit."]

    : p>=.4?["Stagiaire","Le sport business est plein de surprises. Bonne nouvelle : la newsletter les explique."]
    : ["Supporter","Tu regardes le match, pas le business. On peut arranger ça."];
  const rows=[];for(let k=0;k<n;k+=10)rows.push(G.res.slice(k,k+10).map(r=>r?"🟩":"🟥").join(""));const grid=rows.join("\n");
  const txt=`Vrai ou Bullshit ? · ${G.wk.label}\n${grid}\n${sc}/${n} · ${t}${boss?" · question boss trouvée 💥":""}\n\nTu fais mieux ? Identifie 2 personnes qui pensent tout savoir sur le sport business 👇\n${SITE.siteUrl?SITE.siteUrl+"\n":""}#RevenueGame #SportBusiness`;

    <div class="score">${sc}<small>/${n}</small></div>
    <div class="title">${esc(t)}</div>

    <div class="grid">${rows.join("<br>")}</div>
    <div class="share"><textarea id="st">${esc(txt)}</textarea>
      <div class="row"><button class="btn red" id="cp">Copier pour LinkedIn</button><button class="btn ghost" id="rp">Rejouer</button><a class="btn ghost" href="#archives">Autres semaines</a><span class="okmsg" id="ok"></span></div></div>
  </div>`;
  document.getElementById("cp").onclick=async()=>{const ta=document.getElementById("st"),m=document.getElementById("ok");
    try{await navigator.clipboard.writeText(ta.value);m.textContent="Copié ✓"}catch(e){ta.focus();ta.select();m.textContent="Texte sélectionné : Ctrl+C"}};
  document.getElementById("rp").onclick=()=>{G.i=0;G.res=[];question()};
}

/* ---------- APERÇU (brouillon non publié) ---------- */
async function pagePreview(){
  view.innerHTML='<p style="font-family:var(--mono);padding:40px 0">Chargement du brouillon…</p>';
  const d=DRAFT;
  if(!d||!d.week||!Array.isArray(d.week.items)||!d.week.items.length){
    view.innerHTML=`<div class="preview-bar"><b>APERÇU</b> Aucun brouillon en attente de validation.</div><p style="padding:20px 0"><a class="btn" href="#jeu">Voir la grille publiée →</a></p>`;
    return;
  }
  const w=d.week, nEd=w.items.filter(i=>i.ed && i.ed===(EDITIONS[0]||{}).n).length;
  const bar=`<div class="preview-bar"><b>APERÇU · NON PUBLIÉ</b> ${esc(w.label)} · ${esc(d.status==="exemple"?"exemple de brouillon":"en attente de ta validation")} · ${w.items.filter(i=>i.a).length} vrais / ${w.items.filter(i=>!i.a).length} bullshit · ${nEd} question(s) sur la dernière édition
    <button class="btn ghost" id="pvlist" style="padding:7px 12px;margin-left:auto">Voir toutes les réponses</button></div>
    <div id="pvanswers" style="display:none" class="pvlist">${w.items.map((it,i)=>`<div><span class="${it.a?'pv-v':'pv-b'}">${it.a?'VRAI':'BS'}</span><b>${i+1}.${it.boss?' [BOSS]':''}</b> ${esc(it.q)}<small>${esc(it.x)} · ${esc(it.s)}${it.ed?' · RG#'+it.ed:''}</small></div>`).join("")}</div>`;
  pageGame(w,false,bar);
  document.getElementById("pvlist").onclick=()=>{const el=document.getElementById("pvanswers");el.style.display=el.style.display==="none"?"grid":"none"};
}

/* ---------- ARCHIVES ---------- */
function pageArchives(){
  view.innerHTML=`<section>
    <div class="sech"><h2>Toutes les <i>grilles</i></h2><span class="pill">${WEEKS.length} grilles</span></div>
    <div class="weeks">${WEEKS.map((w,i)=>`<div class="wk">
      <div class="n">${w.n?String(w.n).padStart(2,'0'):'HS'}</div>
      <div><div class="t">${esc(w.label)} · ${esc(w.theme)}</div><div class="s">${esc(w.dates)}${w.ed.length?' · liée à '+w.ed.map(n=>'RG#'+n).join(', '):''}</div></div>
      <a class="btn ${i===0?'red':''}" href="#${w.id}">${i===0?'Jouer la grille de la semaine':'Rejouer'} →</a></div>`).join("")}</div>
  </section>`;
}

/* ---------- NEWSLETTER ---------- */
function edCard(e,i){
  const tag = e.url?'a':'div';
  return `<${tag} class="ed" ${e.url?`href="${e.url}" target="_blank" rel="noopener"`:''}>
    ${i===0?'<span class="new">DERNIÈRE ÉDITION</span>':''}
    <div class="n">#${e.n}</div><div class="t">${esc(e.t)}</div>${e.hook?`<p class="hk">${esc(e.hook)}</p>`:''}<div class="th">${esc(e.theme)}${e.date?' · '+new Date(e.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):''}${e.url?' · Lire ↗':''}</div></${tag}>`;
}
function pageNewsletter(){
  const themes=["Toutes",...new Set(EDITIONS.map(e=>e.theme))];
  const all=EDITIONS.filter(e=>edFilter==="Toutes"||e.theme===edFilter), list=all.slice(0,edLimit);
  view.innerHTML=`<section>
    <div class="sech"><h2>La <i>newsletter</i></h2><a class="btn" href="${SITE.subscribeUrl}" target="_blank" rel="noopener">S’abonner ↗</a></div>
    <div class="filters">${themes.map(t=>`<button class="${t===edFilter?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="cards">${list.map((e,i)=>edCard(e,edFilter==="Toutes"?i:-1)).join("")}</div>
    ${all.length>list.length?`<div style="text-align:center;margin-top:22px"><button class="btn" id="more">Voir plus d’éditions (${all.length-list.length}) ↓</button></div>`:""}
    <p class="note">${EDITIONS.length} éditions publiées sur LinkedIn depuis novembre 2025. Une nouvelle chaque semaine.</p>
  </section>`;
  view.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{edFilter=b.dataset.t;edLimit=12;pageNewsletter()});
  const mo=document.getElementById("more"); if(mo) mo.onclick=()=>{edLimit+=12;const y=scrollY;pageNewsletter();scrollTo(0,y)};
}
